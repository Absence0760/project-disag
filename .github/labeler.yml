# Config for actions/labeler. Each top-level key is a label name; the
# `changed-files` list is the set of glob patterns that, if matched by any
# changed file, applies the label.
#
# Globs match THIS repo's layout: two stdlib-only Python packages at the
# root (disag/, exceed/) plus a web/ tree split into frontend / backend /
# infra. Labels are additive and `sync-labels: true` in the workflow means
# a label is also removed once a PR stops matching. Every label named here
# must already exist in the repo — actions/labeler does not create them.

"area:python":
  - changed-files:
      - any-glob-to-any-file:
          - disag/**
          - exceed/**

"area:frontend":
  - changed-files:
      - any-glob-to-any-file:
          - web/frontend/**

"area:backend":
  - changed-files:
      - any-glob-to-any-file:
          - web/backend/**

"area:infra":
  - changed-files:
      - any-glob-to-any-file:
          - web/infra/**
          # All of .github/, not just workflows/ — CODEOWNERS, the
          # labeler config itself and the issue/PR templates are
          # repo plumbing too, and a PR touching only those would
          # otherwise land with no area label at all.
          - .github/**
          - scripts/**

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**

"area:tests":
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - examples/**
          - web/frontend/e2e/**
          - web/frontend/**/*.test.ts
          - web/frontend/vitest.config.ts
          - web/frontend/playwright.config.ts

"area:claude":
  - changed-files:
      - any-glob-to-any-file:
          - .claude/**

"area:deps":
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - pnpm-lock.yaml
          - web/frontend/package.json
          - web/backend/requirements*.txt
          - .github/dependabot.yml
