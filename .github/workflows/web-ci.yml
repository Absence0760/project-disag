name: Web CI

# Lint + typecheck + build the SvelteKit frontend, and fmt + validate
# the Terraform. `tests.yml` covers the Python packages.
#
# This workflow triggers on EVERY pull request to main, not just web ones.
# It used to carry a workflow-level `paths:` filter, which meant a
# docs-only PR produced no run at all — and therefore no `Web CI gate`
# status. A required check that is never reported blocks a PR forever, so
# the filter moved down to a per-job `if:` on the `changes` job below:
# the workflow always runs and always reports its gate, but on a PR that
# touches nothing web-shaped every real job skips and the gate goes green
# in seconds.
#
# All third-party actions are SHA-pinned with a trailing version
# comment per OpenSSF Scorecard's Pinned-Dependencies rule. Dependabot
# (`.github/dependabot.yml`, `actions` group) keeps the SHAs current
# — bump the comment alongside the SHA when reviewing those PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On-demand run against any ref.
  workflow_dispatch:
  # Weekly sweep of main, after dependabot-auto-merge.yml's Monday window.
  # Most bumps are npm and terraform, so this workflow — not tests.yml —
  # is the one that would catch them. `schedule` carries no path filter,
  # so the sweep runs the full job set regardless of what changed.
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the rest of this workflow has anything to do. Replaces
  # the workflow-level `paths:` filter that used to gate the whole run —
  # see the header comment for why that had to move.
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Does this change touch the web surface?
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Anything that is not a pull_request — a push to main, the Monday
          # sweep, a manual dispatch — runs the full set. There is no base to
          # diff against, and those runs exist precisely to be exhaustive.
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event is $EVENT, not pull_request — running every job."
            echo "web=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The file list comes from the API, not from a diff against a
          # fetched base: no fetch-depth games, and it is the same list
          # GitHub itself shows on the PR.
          files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')
          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # Two entries here are not obviously "web" and both got added
          # after something broke main:
          #
          #   pnpm-lock.yaml — a lockfile-only change (exactly what
          #   dependabot-lockfile.yml commits) could reach main without the
          #   frontend ever being built against it.
          #
          #   docs/ — the docs site imports the repo's markdown at BUILD
          #   time (`import x from '../../../../../docs/x.md?raw'` in
          #   src/lib/server/docs.ts). Deleting or renaming a doc breaks
          #   `pnpm build:web`, but with docs/ absent from this filter the
          #   whole web suite skipped and the PR went green — #119 removed
          #   docs/building.md and landed a red main exactly that way.
          if printf '%s\n' "$files" | grep -qE '^(web/|docs/|package\.json$|pnpm-lock\.yaml$|scripts/check_root_scripts\.mjs$|\.github/workflows/web-ci\.yml$)'; then
            echo "web=true" >>"$GITHUB_OUTPUT"
          else
            echo "Nothing web-shaped changed — every job below will skip."
            echo "web=false" >>"$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here — the `packageManager` field in the root
        # package.json is the source of truth; Corepack honours it.
        # Pin must be v6+: v4 runs on Node 20 and can't install
        # pnpm@11.1.2 (which requires Node >= 22.13).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm build:web

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # The Playwright base image ships browsers + system deps preinstalled
    # so `playwright install` becomes a no-op and we don't pay for OS
    # package downloads on every run. Pin to the same version as the
    # @playwright/test devDep — drift causes hard-to-diagnose failures.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The Playwright config's webServer runs `vite preview`, which
      # serves web/frontend/build/. The build doesn't exist on a
      # fresh checkout, so make it explicit.
      - run: pnpm build:web
      - run: pnpm e2e
        env:
          # Quiet the warning about HOME being set to /github/home in the
          # container — Playwright writes browser caches to ~/.cache.
          HOME: /root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 7

  e2e-integration:
    name: Frontend E2E integration (real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Same Playwright base image as the mocked job, plus python3 and
    # venv so local_server.py can boot the on-disk S3 stub and run real
    # disag/exceed code against the committed examples/ fixtures.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:py
      # webServer runs `vite preview` → needs the build to exist.
      - run: pnpm build:web
      - run: pnpm e2e:integration
        env:
          HOME: /root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-integration-report
          path: web/frontend/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Lambda zip build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # Smoke check: the handler module imports correctly when the
      # disag/exceed packages are on sys.path. boto3 isn't installed in
      # CI, so stub it so the import line doesn't fail.
      - name: Stub boto3 + import handler
        env:
          INPUTS_BUCKET: ci-stub
          OUTPUTS_BUCKET: ci-stub
        run: |
          mkdir -p .stubs
          cat > .stubs/boto3.py <<'PY'
          def client(*_a, **_k):
              raise RuntimeError('boto3 stub — runtime only')
          PY
          PYTHONPATH=".:.stubs" python3 -c "import web.backend.handler"
      - name: Build Lambda zip
        run: bash web/backend/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-zip
          path: web/backend/lambda.zip
          retention-days: 7

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.3'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  root-scripts:
    name: Root scripts guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 5
    # Stdlib-only Node — no pnpm install needed. Validates the root
    # package.json scripts block against the estate format (CLAUDE.md).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/check_root_scripts.mjs

      # The two E2E jobs run in the Playwright container, whose bundled
      # browser binaries must match the @playwright/test devDep exactly. A
      # mismatch surfaces as "Executable doesn't exist at
      # /ms-playwright/chromium_headless_shell-<build>" — not as a version
      # error — so it reads like a broken image rather than drift.
      #
      # Dependabot bumps the devDep but has no updater for a
      # `container.image:` tag, so the pin drifts silently on every
      # Playwright release. It did: the devDep moved to 1.62.1 on
      # 2026-08-03 (#84) while the image stayed at 1.61.1, and every
      # web-ci run failed for the 17 days nobody looked. The comment on
      # the e2e job already said "pin to the same version" — a comment
      # was not enough, hence this check.
      - name: Playwright container pin matches the devDep
        run: |
          set -euo pipefail
          dep=$(jq -r '.devDependencies["@playwright/test"]' web/frontend/package.json | sed 's/^[\^~]//')
          pins=$(grep -oP 'mcr\.microsoft\.com/playwright:v\K[0-9]+\.[0-9]+\.[0-9]+(?=-noble)' \
                   .github/workflows/web-ci.yml | sort -u)
          if [ "$(printf '%s' "$pins" | grep -c .)" -ne 1 ] || [ "$pins" != "$dep" ]; then
            echo "::error::Playwright drift — @playwright/test is $dep but web-ci.yml pins [$(echo $pins)]. Bump every container image to v${dep}-noble."
            exit 1
          fi
          echo "Playwright pin and devDep agree: $dep"

  ci-gate:
    # NAME MUST BE UNIQUE ACROSS WORKFLOWS. Branch protection matches a
    # required check by its context name, so two workflows both reporting
    # "CI gate" collapse into one required context and the merge fires on
    # whichever reports first. That happened: on #94 tests.yml reported
    # `CI gate` success at 07:01:25Z, this workflow reported `CI gate`
    # failure at 07:04:44Z, and the PR merged at 07:01:27Z — landing a red
    # web-ci on main and leaving the Playwright break unnoticed for 17
    # days. `CI gate` (tests.yml) and `Web CI gate` (here) are now separate
    # required contexts. Never give a third workflow either name.
    name: Web CI gate
    runs-on: ubuntu-latest
    if: always()
    # `changes` is in this list deliberately: if it errors, every job below
    # it reports `skipped`, which the check below tolerates. Without
    # `changes` here, a broken detector would read as an all-green gate.
    needs: [changes, frontend, e2e, e2e-integration, backend, terraform, root-scripts]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::Web CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
