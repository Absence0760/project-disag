name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # On-demand run against any ref. The only way to verify main itself
  # without waiting for the weekly sweep below.
  workflow_dispatch:
  # Weekly sweep of main. Dependabot opens PRs Monday 06:00 UTC and
  # dependabot-auto-merge.yml lands them by ~07:05; 09:00 is clear of that
  # window, so the week's accumulated bumps get verified together. Those
  # merges produce no push run of their own — see the comment block in
  # dependabot-auto-merge.yml for why.
  schedule:
    - cron: '0 9 * * 1'

# Cancel in-progress runs of the same workflow on the same ref.  Saves CI
# time when multiple commits land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal top-level grant per OpenSSF Scorecard's Token-Permissions rule.
# Each job inherits this; if a future job needs to write something
# (releases, packages, comments), opt in at the job level.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Project policy: Python ≥ 3.14 (CLAUDE.md). 3.14 matches the
        # deployed Lambda runtime; 3.13 is kept as the only older line
        # still on python.org's security-fix list, which catches the
        # occasional 3.14-only-feature regression before users hit it.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit + e2e tests
        run: python -m unittest discover tests -v

      - name: Verify demo generators are deterministic
        # Re-run every generator and assert no committed file changed.
        # Catches accidental drift between generate.py and the data/
        # snapshot.
        run: |
          for demo in examples/method*_demo; do
            if [ -f "$demo/generate.py" ]; then
              echo "::group::regenerating $demo"
              python3 "$demo/generate.py"
              echo "::endgroup::"
            fi
          done
          if ! git diff --exit-code; then
            echo
            echo "::error::Demo data files differ from committed snapshot."
            echo "If this is intentional, run the generators locally and commit the result."
            exit 1
          fi

  ci-gate:
    # NAME MUST BE UNIQUE ACROSS WORKFLOWS — see the matching comment on
    # web-ci.yml's `Web CI gate`. Branch protection matches a required
    # check by context name, so a second workflow reporting "CI gate"
    # collapses into this one required context and the merge fires on
    # whichever reports first. Never give another workflow this name.
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
