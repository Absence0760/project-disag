name: Security

# Static analysis. CodeQL on EVERY push to main (no path filter — the
# OpenSSF Scorecard SAST check counts unscanned default-branch commits
# against us, and docs-only merges were the gap), PRs that touch code
# (docs-only PRs still skip pre-merge; the post-merge push scan covers
# them), and weekly to catch CVEs disclosed since the last commit.
# Findings flow to the GitHub Security tab via SARIF.
#
# Adapted from project-running/.github/workflows/security.yml for
# this repo's much smaller surface:
#   - python covers disag/, exceed/, tests/, web/backend/
#   - javascript-typescript covers web/frontend/ (SvelteKit + TS)
#   - actions covers every workflow under .github/workflows/
#
# What's not covered:
#   - Trivy / container scanning — there's no Dockerfile in this repo.
#     If a Lambda container image gets added later, port the Trivy job
#     from project-running/workflows/security.yml.
#
# All actions SHA-pinned with a trailing version comment — same
# discipline as project-running.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'

# Top-level minimal grant — Scorecard's Token-Permissions rule wants
# elevated permissions (security-events: write, actions: read) at the
# job level only, so a future job added here doesn't silently inherit
# them.
permissions:
  contents: read

jobs:
  codeql-python:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:python'

  codeql-javascript:
    name: CodeQL (TypeScript/JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:javascript-typescript'

  codeql-actions:
    name: CodeQL (GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          # `actions` only ships a security-extended ceiling; CodeQL
          # falls back to that automatically — no per-language branching.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:actions'
