version: 2

# Ecosystems present in this repo:
#   pip            — disag/ + exceed/ + tests/ are stdlib-only by
#                    policy (see project-root CLAUDE.md). web/backend
#                    uses boto3 from the Lambda runtime — no
#                    requirements file there either. The single pip
#                    surface is packaging/build-requirements.txt
#                    (PyInstaller + pip, hash-pinned via pip-compile),
#                    consumed by release.yml when building the user-
#                    facing CLI binaries.
#   npm            — root workspace (dev tooling, e.g. concurrently)
#                    + web/frontend SvelteKit app. ONE entry, at `/`:
#                    pnpm-lock.yaml lives at the root and covers every
#                    workspace member, so the root entry already bumps
#                    web/frontend/package.json and re-locks in the same
#                    commit. Listing /web/frontend as well made Dependabot
#                    treat it as a standalone package and open a duplicate
#                    PR that edited package.json with no lockfile — an
#                    automatic ERR_PNPM_OUTDATED_LOCKFILE (#85 vs #86).
#   terraform      — web/infra AWS provider + modules.
#   github-actions — the workflows under .github/workflows/.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      # Bundle the SvelteKit ecosystem so a Vite minor doesn't churn
      # the review queue on its own.
      sveltekit-ecosystem:
        patterns:
          - '@sveltejs/*'
          - 'svelte'
          - 'svelte-*'
          - 'vite'
      formatters:
        patterns:
          - 'prettier'
          - 'prettier-*'
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # TypeScript 7 is the native (tsgo) rewrite, and svelte-check 4.7.6
      # — the latest — refuses a plain TS 7 install outright:
      #
      #   Error: TypeScript 7 support currently requires both TypeScript 7
      #   and TypeScript 6 installed in your project, and requires using
      #   the --tsgo or --tsgo-experimental-api flag.
      #
      # Taking it means carrying two TypeScript installs under an npm
      # alias and putting an experimental flag in `check:web`, which is a
      # required merge gate — a migration, not a bump, and it buys nothing
      # for a dev-only type-checker. #112 was closed for this reason.
      #
      # REVISIT when svelte-check supports TS 7 with a single install;
      # drop this entry then. Minor and patch updates still come through.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    directory: /web/infra
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform
    groups:
      aws-provider:
        patterns:
          - 'hashicorp/aws'
          - 'hashicorp/random'
          - 'carlpett/sops'
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
