packages:
  - 'web/frontend'

# Force-bump transitive deps that ship CVEs upstream hasn't patched yet.
# Each entry should reference the GHSA in a comment so a future reader
# knows why the pin exists.
overrides:
  # GHSA-pxg6-pf52-xh8x — cookie@<0.7 accepts OOB chars in name/path/domain.
  # SvelteKit 2.60.x still declares cookie ^0.6.0; the override forces the
  # 1.x line (API-compatible for SvelteKit's usage; verified 2026-05).
  # Tightened from `>=0.7.0` to lock the major and avoid an unreviewed
  # 2.x landing transitively.
  cookie: '^1.1.1'
  # GHSA-p88m-4jfj-68fv, GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q,
  # GHSA-hm92-r4w5-c3mj, GHSA-pr7r-676h-xcf6, GHSA-35p6-xmwp-9g52,
  # GHSA-g8m3-5g58-fq7m — undici <7.28.0 (dev-only,
  # via vitest → jsdom) ships a cluster of CVEs patched in 7.28.0. Force
  # the patched 7.x line — jsdom@29 pins undici ^7, so stay below the 8.x
  # major (which drops the internal dispatcher API jsdom loads) while
  # clearing the CVEs (verified 2026-07).
  undici@<7.28.0: '>=7.28.0 <8'
  # GHSA-w7jw-789q-3m8p — shell-quote <1.8.4 quote() fails to escape
  # newlines (dev-only, via concurrently). Belt-and-braces since the
  # concurrently 10.x bump (it pins shell-quote 1.8.4 itself); kept so a
  # future dependency can't reintroduce a vulnerable version.
  shell-quote@<1.8.4: '>=1.8.4'
