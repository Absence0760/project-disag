packages:
  - 'web/frontend'

# Force-bump transitive deps that ship CVEs upstream hasn't patched yet.
# Each entry should reference the GHSA in a comment so a future reader
# knows why the pin exists.
overrides:
  # GHSA-pxg6-pf52-xh8x — cookie@<0.7 accepts OOB chars in name/path/domain.
  # SvelteKit 2.60.x still declares cookie ^0.6.0; the override forces the
  # 1.x line (API-compatible for SvelteKit's usage; verified 2026-05).
  # Tightened from `>=0.7.0` to lock the major and avoid an unreviewed
  # 2.x landing transitively.
  cookie: '^1.1.1'
  # undici is dev-only here (vitest → jsdom) and has shipped two CVE
  # clusters: seven advisories patched in 7.28.0, then GHSA-4cwx-7wf7-3272,
  # GHSA-8xcm-r25x-g524, GHSA-jr45-8vmc-qm54, GHSA-m8rv-5g2x-5cg5 and
  # GHSA-v3r7-h72x-cjcm filed against 7.28.0 itself and patched in 7.29.0
  # (7.x) and 8.9.0 (8.x).
  #
  # jsdom@30 moved to undici 8.x, so the 8.x floor is the one doing the
  # work now and 8.10.1 is what resolves. The 7.x entry stays as a guard:
  # it costs nothing and stops a dependency that still declares ^7 from
  # quietly reintroducing the vulnerable line. Keep both floors when
  # bumping — dropping the one that currently matches nothing is how this
  # protection rots (verified 2026-09).
  undici@<7.29.0: '>=7.29.0 <8'
  undici@>=8.0.0 <8.9.0: '>=8.9.0'
  # GHSA-w7jw-789q-3m8p — shell-quote <1.8.4 quote() fails to escape
  # newlines (dev-only, via concurrently). Belt-and-braces since the
  # concurrently 10.x bump (it pins shell-quote 1.8.4 itself); kept so a
  # future dependency can't reintroduce a vulnerable version.
  shell-quote@<1.8.4: '>=1.8.4'
